services:
  tg-video-bot:
    build: .
    container_name: tg_video_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./inst_cookies.txt:/app/cookies.txt:ro
    read_only: true
    tmpfs:
      - /tmp:size=128M,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
